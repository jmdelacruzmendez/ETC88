<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 660" width="480" height="660">
  <!-- fondo azul profundo -->
  <rect width="480" height="660" fill="#1B3A5C"/>
  <!-- marco interior -->
  <rect x="26" y="26" width="428" height="608" fill="none" stroke="#E8D4A8" stroke-width="1" opacity="0.55"/>

  <!-- estrellas -->
  <g fill="#F7F1E3">
    <circle cx="70" cy="80" r="1.4"/><circle cx="130" cy="55" r="1"/><circle cx="210" cy="90" r="1.6"/>
    <circle cx="300" cy="60" r="1"/><circle cx="380" cy="100" r="1.3"/><circle cx="410" cy="62" r="0.8"/>
    <circle cx="90" cy="150" r="0.9"/><circle cx="350" cy="165" r="1.1"/><circle cx="55" cy="210" r="0.8"/>
  </g>
  <!-- estrella polar -->
  <g transform="translate(240, 150)">
    <circle r="3" fill="#E8D4A8"/>
    <circle r="9" fill="#E8D4A8" opacity="0.2"/>
    <line x1="0" y1="-13" x2="0" y2="-6" stroke="#E8D4A8" stroke-width="0.8"/>
    <line x1="0" y1="13" x2="0" y2="6" stroke="#E8D4A8" stroke-width="0.8"/>
    <line x1="-13" y1="0" x2="-6" y2="0" stroke="#E8D4A8" stroke-width="0.8"/>
    <line x1="13" y1="0" x2="6" y2="0" stroke="#E8D4A8" stroke-width="0.8"/>
  </g>

  <!-- pez-brújula -->
  <g transform="translate(240, 250)">
    <line x1="0" y1="-88" x2="0" y2="-30" stroke="#E8D4A8" stroke-width="0.7" stroke-dasharray="2 5" opacity="0.5"/>
    <path d="M -46 0 Q -12 -18 30 0 Q -12 18 -46 0 Z" fill="none" stroke="#E36C4F" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M 30 0 L 52 -13 L 52 13 Z" fill="#E36C4F"/>
    <circle cx="-24" cy="-4" r="2" fill="#E36C4F"/>
  </g>

  <!-- horizonte -->
  <line x1="60" y1="320" x2="420" y2="320" stroke="#E8D4A8" stroke-width="1" opacity="0.5"/>

  <!-- wordmark -->
  <text x="240" y="420" text-anchor="middle" fill="#F7F1E3" font-family="Georgia, serif" font-size="80" letter-spacing="6">ETC</text>
  <text x="240" y="462" text-anchor="middle" fill="#E8D4A8" font-family="Georgia, serif" font-size="30" letter-spacing="14">LXXXVIII</text>

  <line x1="150" y1="492" x2="330" y2="492" stroke="#E36C4F" stroke-width="1.5"/>
  <text x="240" y="520" text-anchor="middle" fill="#F7F1E3" font-family="Georgia, serif" font-size="18" font-style="italic" letter-spacing="2">Siempre amigos</text>
  <text x="240" y="540" text-anchor="middle" fill="#E8D4A8" font-family="Inter, Arial, sans-serif" font-size="10" letter-spacing="3">JUAN 15,15</text>

  <!-- pie -->
  <text x="240" y="586" text-anchor="middle" fill="#E8D4A8" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="2">SAN PEDRO DE MACORÍS</text>
  <text x="240" y="606" text-anchor="middle" fill="#F7F1E3" font-family="Inter, Arial, sans-serif" font-size="10" opacity="0.8">4–6 de septiembre de 2026 · Higüey</text>
  <text x="240" y="622" text-anchor="middle" fill="#F7F1E3" font-family="Inter, Arial, sans-serif" font-size="8" opacity="0.6">Casa de Retiro «La Ceiba del Salado»</text>
</svg>
