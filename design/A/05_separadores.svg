<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" fill="#F7F1E3"/>
  <text x="40" y="40" fill="#1B3A5C" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="5">ETC 88 · DIRECCIÓN A · SEPARADORES POR ÁREA (mensajes de Padre Paul) [PROPUESTA]</text>

  <!-- ===== GUÍAS ===== -->
  <g transform="translate(40, 70)">
    <rect width="220" height="220" fill="#1B3A5C"/>
    <rect x="0" y="0" width="220" height="6" fill="#E36C4F"/>
    <!-- icono brújula -->
    <g transform="translate(110, 70)" stroke="#E8D4A8" stroke-width="2" fill="none">
      <circle r="26"/>
      <path d="M 0 -16 L 7 0 L 0 16 L -7 0 Z" fill="#E36C4F" stroke="none"/>
      <circle r="2.5" fill="#E8D4A8" stroke="none"/>
    </g>
    <text x="110" y="130" text-anchor="middle" fill="#F7F1E3" font-family="Georgia, serif" font-size="26" letter-spacing="2">Guías</text>
    <text x="110" y="160" text-anchor="middle" fill="#E8D4A8" font-family="Inter, Arial, sans-serif" font-size="9.5" letter-spacing="1">Enfocados en el</text>
    <text x="110" y="176" text-anchor="middle" fill="#E36C4F" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">PARTICIPANTE</text>
    <text x="110" y="202" text-anchor="middle" fill="#E8D4A8" font-family="Inter, Arial, sans-serif" font-size="8" opacity="0.75">todo es para él, no para</text>
    <text x="110" y="214" text-anchor="middle" fill="#E8D4A8" font-family="Inter, Arial, sans-serif" font-size="8" opacity="0.75">lucirse el guía</text>
  </g>

  <!-- ===== COCINA ===== -->
  <g transform="translate(280, 70)">
    <rect width="220" height="220" fill="#E36C4F"/>
    <rect x="0" y="0" width="220" height="6" fill="#1B3A5C"/>
    <!-- icono: palangana / lavatorio -->
    <g transform="translate(110, 66)" stroke="#F7F1E3" stroke-width="2" fill="none">
      <path d="M -28 0 Q 0 26 28 0" />
      <line x1="-32" y1="0" x2="32" y2="0"/>
      <path d="M -10 -16 Q -4 -8 -10 0" />
      <path d="M 2 -18 Q 8 -9 2 0" />
    </g>
    <text x="110" y="128" text-anchor="middle" fill="#F7F1E3" font-family="Georgia, serif" font-size="26" letter-spacing="2">Cocina</text>
    <text x="110" y="158" text-anchor="middle" fill="#1B3A5C" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">ENTREGA Y SACRIFICIO</text>
    <text x="110" y="184" text-anchor="middle" fill="#F7F1E3" font-family="Inter, Arial, sans-serif" font-size="8" opacity="0.9">servir desde la sombra ·</text>
    <text x="110" y="196" text-anchor="middle" fill="#F7F1E3" font-family="Inter, Arial, sans-serif" font-size="8" opacity="0.9">Cristo en la mesa y el Lavatorio</text>
    <text x="110" y="214" text-anchor="middle" fill="#1B3A5C" font-family="Inter, Arial, sans-serif" font-size="8.5" font-style="italic">Jn 13,14–15</text>
  </g>

  <!-- ===== MÚSICA ===== -->
  <g transform="translate(520, 70)">
    <rect width="220" height="220" fill="#E8D4A8"/>
    <rect x="0" y="0" width="220" height="6" fill="#E36C4F"/>
    <!-- icono nota+ola -->
    <g transform="translate(110, 66)" stroke="#1B3A5C" stroke-width="2" fill="none">
      <circle cx="-10" cy="10" r="6" fill="#1B3A5C" stroke="none"/>
      <line x1="-4" y1="10" x2="-4" y2="-16" stroke="#1B3A5C" stroke-width="2"/>
      <path d="M -4 -16 Q 10 -14 14 -6" stroke="#1B3A5C" stroke-width="2"/>
      <path d="M 16 14 Q 22 8 28 14" stroke="#E36C4F" stroke-width="2"/>
    </g>
    <text x="110" y="128" text-anchor="middle" fill="#1B3A5C" font-family="Georgia, serif" font-size="26" letter-spacing="2">Música</text>
    <text x="110" y="158" text-anchor="middle" fill="#1B3A5C" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="bold" letter-spacing="1">ANIMACIÓN ESPIRITUAL</text>
    <text x="110" y="174" text-anchor="middle" fill="#E36C4F" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="bold">antes que técnica</text>
    <text x="110" y="200" text-anchor="middle" fill="#1B3A5C" font-family="Inter, Arial, sans-serif" font-size="8" opacity="0.8">eleva la atmósfera del retiro,</text>
    <text x="110" y="212" text-anchor="middle" fill="#1B3A5C" font-family="Inter, Arial, sans-serif" font-size="8" opacity="0.8">no es solo lo técnico</text>
  </g>

  <!-- ===== ASESORES ===== -->
  <g transform="translate(760, 70)">
    <rect width="220" height="220" fill="#1B3A5C"/>
    <rect x="0" y="0" width="220" height="6" fill="#E8D4A8"/>
    <!-- icono: timón -->
    <g transform="translate(110, 66)" stroke="#E8D4A8" stroke-width="2" fill="none">
      <circle r="22"/>
      <circle r="7"/>
      <g stroke="#E36C4F">
        <line x1="0" y1="-22" x2="0" y2="-30"/>
        <line x1="0" y1="22" x2="0" y2="30"/>
        <line x1="-22" y1="0" x2="-30" y2="0"/>
        <line x1="22" y1="0" x2="30" y2="0"/>
      </g>
    </g>
    <text x="110" y="128" text-anchor="middle" fill="#F7F1E3" font-family="Georgia, serif" font-size="24" letter-spacing="1">Asesores</text>
    <text x="110" y="158" text-anchor="middle" fill="#E8D4A8" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="bold" letter-spacing="1">UN SOLO EQUIPO</text>
    <text x="110" y="174" text-anchor="middle" fill="#E36C4F" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="bold">funciones distintas</text>
    <text x="110" y="200" text-anchor="middle" fill="#E8D4A8" font-family="Inter, Arial, sans-serif" font-size="8" opacity="0.8">transmitir, no reinterpretar ·</text>
    <text x="110" y="212" text-anchor="middle" fill="#E8D4A8" font-family="Inter, Arial, sans-serif" font-size="8" opacity="0.8">servicio antes que protagonismo</text>
  </g>

  <text x="40" y="340" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="11" opacity="0.7">Cada área = una carta de navegación. Mismo sistema, color rotado. El mensaje pastoral viene de Padre Paul (confirmado).</text>

  <!-- versión 1 tinta -->
  <text x="40" y="386" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="3" opacity="0.6">MISMO SISTEMA · 1 TINTA (impresión barata)</text>
  <g transform="translate(40, 400)">
    <rect width="150" height="130" fill="none" stroke="#1B3A5C" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="5" fill="#1B3A5C"/>
    <g transform="translate(75, 46)" stroke="#1B3A5C" stroke-width="1.8" fill="none">
      <circle r="20"/>
      <path d="M 0 -13 L 6 0 L 0 13 L -6 0 Z" fill="#1B3A5C" stroke="none"/>
    </g>
    <text x="75" y="96" text-anchor="middle" fill="#1B3A5C" font-family="Georgia, serif" font-size="19">Guías</text>
    <text x="75" y="116" text-anchor="middle" fill="#1B3A5C" font-family="Inter, Arial, sans-serif" font-size="7.5" letter-spacing="1">ENFOCADOS EN EL PARTICIPANTE</text>
  </g>
  <g transform="translate(205, 400)">
    <rect width="150" height="130" fill="#1B3A5C"/>
    <rect x="0" y="0" width="150" height="5" fill="#F7F1E3"/>
    <g transform="translate(75, 46)" stroke="#F7F1E3" stroke-width="1.8" fill="none">
      <path d="M -20 0 Q 0 18 20 0"/><line x1="-23" y1="0" x2="23" y2="0"/>
    </g>
    <text x="75" y="96" text-anchor="middle" fill="#F7F1E3" font-family="Georgia, serif" font-size="19">Cocina</text>
    <text x="75" y="116" text-anchor="middle" fill="#F7F1E3" font-family="Inter, Arial, sans-serif" font-size="7.5" letter-spacing="1">ENTREGA Y SACRIFICIO</text>
  </g>
  <text x="375" y="470" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="10" opacity="0.65">A 1 tinta (azul sobre crema, o</text>
  <text x="375" y="486" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="10" opacity="0.65">crema sobre azul) el sistema</text>
  <text x="375" y="502" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="10" opacity="0.65">sigue funcionando — clave para</text>
  <text x="375" y="518" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="10" opacity="0.65">imprimir folletos barato.</text>
</svg>
