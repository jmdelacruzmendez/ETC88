<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <rect width="760" height="420" fill="#F7F1E3"/>
  <text x="40" y="40" fill="#1B3A5C" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="5">ETC 88 · DIRECCIÓN A · ICONOGRAFÍA (line-art náutico) [PROPUESTA]</text>

  <g stroke="#1B3A5C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- brújula -->
    <g transform="translate(80, 110)">
      <circle r="30"/>
      <path d="M 0 -20 L 9 0 L 0 20 L -9 0 Z" fill="#E36C4F" stroke="none"/>
      <circle r="3" fill="#1B3A5C" stroke="none"/>
    </g>
    <!-- pez -->
    <g transform="translate(200, 110)">
      <path d="M -30 0 Q -8 -16 22 0 Q -8 16 -30 0 Z"/>
      <path d="M 22 0 L 38 -10 L 38 10 Z" fill="#E36C4F" stroke="none"/>
      <circle cx="-16" cy="-4" r="1.8" fill="#1B3A5C" stroke="none"/>
    </g>
    <!-- ancla -->
    <g transform="translate(320, 110)">
      <circle cx="0" cy="-26" r="6"/>
      <line x1="0" y1="-20" x2="0" y2="22"/>
      <line x1="-16" y1="-8" x2="16" y2="-8"/>
      <path d="M -22 6 Q -22 24 0 24 Q 22 24 22 6"/>
    </g>
    <!-- timón -->
    <g transform="translate(440, 110)">
      <circle r="26"/><circle r="8"/>
      <line x1="0" y1="-26" x2="0" y2="-34"/><line x1="0" y1="26" x2="0" y2="34"/>
      <line x1="-26" y1="0" x2="-34" y2="0"/><line x1="26" y1="0" x2="34" y2="0"/>
    </g>
    <!-- estrella polar -->
    <g transform="translate(560, 110)">
      <path d="M 0 -28 L 7 -8 L 28 -8 L 11 5 L 18 26 L 0 13 L -18 26 L -11 5 L -28 -8 L -7 -8 Z" fill="#E36C4F" stroke="none"/>
      <path d="M 0 -28 L 7 -8 L 28 -8 L 11 5 L 18 26 L 0 13 L -18 26 L -11 5 L -28 -8 L -7 -8 Z"/>
    </g>
    <!-- mapa enrollado -->
    <g transform="translate(680, 110)">
      <path d="M -22 -18 Q -28 0 -22 18 L 22 18 Q 28 0 22 -18 Z"/>
      <line x1="-12" y1="-8" x2="12" y2="-8"/>
      <line x1="-12" y1="2" x2="8" y2="2"/>
      <path d="M -6 12 l 6 -4 l 6 4" stroke="#E36C4F"/>
    </g>

    <!-- fila 2: peces de la clausura -->
    <g transform="translate(80, 250)">
      <path d="M -28 0 Q -8 -14 18 0 Q -8 14 -28 0 Z"/>
      <path d="M 18 0 L 32 -8 L 32 8 Z" fill="#E36C4F" stroke="none"/>
      <path d="M -10 -22 Q 6 -22 14 -14" stroke-dasharray="2 3"/>
    </g>
    <!-- remo -->
    <g transform="translate(200, 250)">
      <line x1="-22" y1="22" x2="14" y2="-14"/>
      <path d="M 14 -14 Q 24 -24 30 -14 Q 24 -8 14 -14 Z" fill="#E36C4F" stroke="none"/>
    </g>
    <!-- cuerda / nudo -->
    <g transform="translate(320, 250)">
      <circle r="14"/>
      <path d="M -14 0 Q -26 -14 -14 -22"/>
      <path d="M 14 0 Q 26 14 14 22"/>
    </g>
    <!-- catalejo -->
    <g transform="translate(440, 250)">
      <rect x="-26" y="-8" width="30" height="16" rx="3"/>
      <rect x="4" y="-11" width="22" height="22" rx="3" stroke="#E36C4F"/>
    </g>
    <!-- ola -->
    <g transform="translate(560, 250)">
      <path d="M -28 6 Q -18 -10 -8 6 Q 2 -10 12 6 Q 22 -10 28 6"/>
      <path d="M -28 18 Q -18 2 -8 18 Q 2 2 12 18 Q 22 2 28 18" opacity="0.5"/>
    </g>
    <!-- pan (cocina) -->
    <g transform="translate(680, 250)">
      <path d="M -24 8 Q -24 -14 0 -14 Q 24 -14 24 8 Z"/>
      <line x1="-12" y1="-6" x2="-6" y2="2" stroke="#E36C4F"/>
      <line x1="0" y1="-8" x2="6" y2="0" stroke="#E36C4F"/>
      <line x1="12" y1="-6" x2="18" y2="2" stroke="#E36C4F"/>
    </g>
  </g>

  <g fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="10" opacity="0.7">
    <text x="80" y="166" text-anchor="middle">brújula</text>
    <text x="200" y="166" text-anchor="middle">pez ICTUS</text>
    <text x="320" y="166" text-anchor="middle">ancla</text>
    <text x="440" y="166" text-anchor="middle">timón</text>
    <text x="560" y="166" text-anchor="middle">estrella</text>
    <text x="680" y="166" text-anchor="middle">bitácora</text>
    <text x="80" y="306" text-anchor="middle">peces clausura</text>
    <text x="200" y="306" text-anchor="middle">remo</text>
    <text x="320" y="306" text-anchor="middle">nudo / lazo</text>
    <text x="440" y="306" text-anchor="middle">catalejo</text>
    <text x="560" y="306" text-anchor="middle">ola</text>
    <text x="680" y="306" text-anchor="middle">pan</text>
  </g>

  <text x="40" y="368" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="11" opacity="0.7">Trazo uniforme 2px, esquinas redondeadas, acento coral puntual. Funcionan a 1 tinta (todo azul) o con el acento coral.</text>
  <text x="40" y="392" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="11" opacity="0.7">Uso: brújula→Guías · pan/palangana→Cocina · ola/nota→Música · timón→Asesores · peces→clausura · ancla→fe.</text>
</svg>
