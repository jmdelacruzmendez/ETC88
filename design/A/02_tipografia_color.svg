<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" width="860" height="640">
  <rect width="860" height="640" fill="#F7F1E3"/>
  <text x="40" y="44" fill="#1B3A5C" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="5">ETC 88 · DIRECCIÓN A · PALETA + TIPOGRAFÍA [PROPUESTA]</text>

  <!-- ===== PALETA ===== -->
  <text x="40" y="84" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="3" opacity="0.6">PALETA</text>
  <!-- swatch 1 -->
  <rect x="40" y="98" width="148" height="92" fill="#1B3A5C"/>
  <text x="50" y="148" fill="#F7F1E3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold">#1B3A5C</text>
  <text x="50" y="166" fill="#F7F1E3" font-family="Inter, Arial, sans-serif" font-size="9" opacity="0.85">Azul profundo · primario</text>
  <text x="50" y="180" fill="#F7F1E3" font-family="Inter, Arial, sans-serif" font-size="8" opacity="0.7">mar · cielo nocturno</text>
  <!-- swatch 2 -->
  <rect x="194" y="98" width="148" height="92" fill="#E8D4A8"/>
  <text x="204" y="148" fill="#1B3A5C" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold">#E8D4A8</text>
  <text x="204" y="166" fill="#1B3A5C" font-family="Inter, Arial, sans-serif" font-size="9">Arena cálida · secundario</text>
  <text x="204" y="180" fill="#1B3A5C" font-family="Inter, Arial, sans-serif" font-size="8" opacity="0.75">papel viejo · puerto</text>
  <!-- swatch 3 -->
  <rect x="348" y="98" width="148" height="92" fill="#E36C4F"/>
  <text x="358" y="148" fill="#F7F1E3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold">#E36C4F</text>
  <text x="358" y="166" fill="#F7F1E3" font-family="Inter, Arial, sans-serif" font-size="9">Coral fuego · acento</text>
  <text x="358" y="180" fill="#F7F1E3" font-family="Inter, Arial, sans-serif" font-size="8" opacity="0.85">el pez · Jn 21</text>
  <!-- swatch 4 -->
  <rect x="502" y="98" width="148" height="92" fill="#F7F1E3" stroke="#1A1A1A" stroke-width="0.5"/>
  <text x="512" y="148" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold">#F7F1E3</text>
  <text x="512" y="166" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="9">Crema papel · fondo</text>
  <!-- swatch 5 -->
  <rect x="656" y="98" width="148" height="92" fill="#1A1A1A"/>
  <text x="666" y="148" fill="#F7F1E3" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold">#1A1A1A</text>
  <text x="666" y="166" fill="#F7F1E3" font-family="Inter, Arial, sans-serif" font-size="9">Tinta · texto</text>
  <!-- contraste -->
  <text x="40" y="214" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="9" opacity="0.7">Contraste: azul/crema ≈ 9:1 (AAA cuerpo) · coral/crema ≈ 3.2:1 (AA solo títulos grandes) · tinta/crema ≈ 16:1.</text>

  <!-- ===== TIPOGRAFÍA ===== -->
  <text x="40" y="262" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="3" opacity="0.6">TIPOGRAFÍA</text>
  <line x1="40" y1="274" x2="820" y2="274" stroke="#E8D4A8" stroke-width="1.5"/>

  <text x="40" y="316" fill="#1B3A5C" font-family="Georgia, serif" font-size="42">Encuentro Total con Cristo</text>
  <text x="40" y="336" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="9" opacity="0.6">DISPLAY · Cormorant Garamond (fallback Georgia) · 40–74 px · portadas y títulos grandes</text>

  <text x="40" y="378" fill="#1B3A5C" font-family="Georgia, serif" font-size="28">1 · ¿Qué es un ETC?</text>
  <text x="40" y="396" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="9" opacity="0.6">TÍTULO H1 · Cormorant Garamond · 24–32 px</text>

  <text x="40" y="432" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Una sola tripulación, funciones distintas</text>
  <text x="40" y="450" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="9" opacity="0.6">SUBTÍTULO H2 · Inter SemiBold · 16–18 px</text>

  <text x="40" y="486" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="13">El ETC es una experiencia que lleva a las personas a Jesús a través del encuentro</text>
  <text x="40" y="504" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="13">consigo mismo y con sus semejantes. Siempre amigos.</text>
  <text x="40" y="524" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="9" opacity="0.6">CUERPO · Inter Regular · 12–14 px · interlineado 1.5</text>

  <text x="40" y="560" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="10" letter-spacing="2" opacity="0.85">VIERNES 7:35 PM · PRIMER PEQUEÑO GRUPO</text>
  <text x="40" y="578" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="9" opacity="0.6">CAPTION / ETIQUETA · Inter · 10–11 px · letter-spacing amplio · mayúsculas</text>

  <text x="40" y="618" fill="#1A1A1A" font-family="Inter, Arial, sans-serif" font-size="9" opacity="0.55">Pareja: Cormorant Garamond (display, gratis · Google Fonts) + Inter (cuerpo, gratis · libre). Ambas con licencia abierta.</text>
</svg>
