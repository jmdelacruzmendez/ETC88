  <text x="200" y="402" text-anchor="middle" fill="#4A5D3A" font-family="Cormorant Garamond, Georgia, serif" font-size="14" font-style="italic" letter-spacing="3">Siempre amigos · Jn 15,15</text>
  <text x="200" y="438" text-anchor="middle" fill="#D4A055" font-family="Inter, Arial, sans-serif" font-size="10" letter-spacing="5">DIRECCIÓN B · LA MESA</text>
