<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" fill="#F7F1E3"/>
  <!-- cielo de amanecer -->
  <rect x="0" y="0" width="400" height="170" fill="#C8DDE6" opacity="0.55"/>
  <!-- sol/horizonte sutil -->
  <circle cx="200" cy="170" r="38" fill="#BF8F4D" opacity="0.15"/>
  <line x1="40" y1="170" x2="360" y2="170" stroke="#BF8F4D" stroke-width="0.5" opacity="0.4"/>
  <!-- sendero -->
  <path d="M 110 320 Q 200 285 295 320" stroke="#BF8F4D" stroke-width="1.5" fill="none" opacity="0.55"/>
  <path d="M 130 320 L 285 320" stroke="#BF8F4D" stroke-width="1" fill="none" stroke-dasharray="3 5" opacity="0.65"/>
  <!-- caminante 1 (izq) -->
  <g transform="translate(168, 215)">
    <circle cx="0" cy="0" r="10" fill="#2E5944"/>
    <path d="M -10 12 L -7 60 M 10 12 L 7 60" stroke="#2E5944" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M -7 60 L -14 95 M 7 60 L 14 95" stroke="#2E5944" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M -10 25 L -28 50 M 10 25 L 26 50" stroke="#2E5944" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- pez sutil al pecho -->
    <g transform="translate(0, 32) scale(0.32)">
      <path d="M -22 0 Q -5 -10 18 0 Q -5 10 -22 0 Z" fill="#BF8F4D"/>
      <path d="M 18 0 L 28 -5 L 28 5 Z" fill="#BF8F4D"/>
    </g>
  </g>
  <!-- caminante 2 (der) -->
  <g transform="translate(232, 212)">
    <circle cx="0" cy="0" r="10" fill="#2E5944"/>
    <path d="M -10 12 L -7 60 M 10 12 L 7 60" stroke="#2E5944" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M -7 60 L -14 95 M 7 60 L 14 95" stroke="#2E5944" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M -10 25 L 28 50 M 10 25 L -26 50" stroke="#2E5944" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <g transform="translate(0, 32) scale(0.32)">
      <path d="M -22 0 Q -5 -10 18 0 Q -5 10 -22 0 Z" fill="#BF8F4D"/>
      <path d="M 18 0 L 28 -5 L 28 5 Z" fill="#BF8F4D"/>
    </g>
  </g>
  <!-- wordmark -->
  <text x="200" y="372" text-anchor="middle" fill="#2E5944" font-family="Source Serif 4, Georgia, serif" font-size="30" letter-spacing="7">ETC LXXXVIII</text>
  <text x="200" y="404" text-anchor="middle" fill="#2E5944" font-family="Source Serif 4, Georgia, serif" font-size="14" font-style="italic" letter-spacing="3" opacity="0.85">Siempre amigos · Jn 15,15</text>
  <text x="200" y="438" text-anchor="middle" fill="#BF8F4D" font-family="Inter, Arial, sans-serif" font-size="10" letter-spacing="5">DIRECCIÓN C · CAMINO</text>
  <!-- swatches -->
  <rect x="120" y="462" width="22" height="22" fill="#2E5944"/>
  <rect x="147" y="462" width="22" height="22" fill="#BF8F4D"/>
  <rect x="174" y="462" width="22" height="22" fill="#C8DDE6"/>
  <rect x="201" y="462" width="22" height="22" fill="#F7F1E3" stroke="#1A1A1A" stroke-width="0.6"/>
  <rect x="228" y="462" width="22" height="22" fill="#1F1F1F"/>
</svg>
